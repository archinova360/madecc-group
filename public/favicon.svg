<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Golden Gradients matching the design of the luxury construction brand -->
    <linearGradient id="gold-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE890" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A640F" />
    </linearGradient>
    <linearGradient id="gold-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D3" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#553E0B" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Right Tall Tower (Main part of the '1' structure) -->
    <path d="M 270 150 L 315 200 L 315 390 L 270 410 Z" fill="url(#gold-grad-1)" />
    <!-- Highlight face of Right Tower for 3D bevel effect -->
    <path d="M 270 150 L 270 410 L 285 415 L 285 168 Z" fill="url(#gold-grad-2)" opacity="0.8" />

    <!-- Left Shorter Tower -->
    <path d="M 195 210 L 240 250 L 240 370 L 195 385 Z" fill="url(#gold-grad-1)" />
    <!-- Highlight face of Left Tower -->
    <path d="M 195 210 L 195 385 L 210 390 L 210 225 Z" fill="url(#gold-grad-2)" opacity="0.9" />

    <!-- Stylized Golden Swoop wrapping around the towers in an orbital trajectory -->
    <path d="M 110 350 C 110 290, 410 280, 410 340 C 410 400, 250 430, 160 410 C 130 400, 110 380, 110 350 Z" 
          fill="none" stroke="url(#gold-grad-1)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Outer accent swoop layer -->
    <path d="M 145 365 C 190 410, 310 420, 395 375" 
          fill="none" stroke="url(#gold-grad-2)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Registered Trademark circled R in golden-yellow -->
  <circle cx="390" cy="225" r="18" fill="none" stroke="url(#gold-grad-1)" stroke-width="3" />
  <text x="390" y="231" font-family="Inter, sans-serif" font-size="16" font-weight="900" fill="url(#gold-grad-1)" text-anchor="middle">R</text>
</svg>
